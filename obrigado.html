<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obrigado pelo Contacto | André Carmo</title>
    <link rel="alternate" hreflang="pt-PT" href="https://www.andrecarmo.pt/obrigado.html">
    <link rel="alternate" hreflang="en" href="https://www.andrecarmo.pt/en/obrigado.html">
    <link rel="alternate" hreflang="x-default" href="https://www.andrecarmo.pt/obrigado.html">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-blue: #0066cc;
            --dark-blue: #001a33;
            --electric-blue: #00d4ff;
            --deep-space: #000814;
            --text-light: #e6f7ff;
            --text-gray: #b3d9ff;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--deep-space) 0%, var(--dark-blue) 100%);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
        }
        .container { max-width: 600px; animation: fadeIn 0.8s ease; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .success-icon {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, var(--primary-blue), var(--electric-blue));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
            font-size: 3rem;
            color: white;
            box-shadow: 0 10px 30px rgba(0, 102, 204, 0.4);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #ffffff, var(--electric-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p { color: var(--text-gray); font-size: 1.2rem; margin-bottom: 2rem; line-height: 1.6; }
        .btn {
            display: inline-block;
            padding: 1rem 2.5rem;
            background: linear-gradient(135deg, var(--primary-blue), var(--electric-blue));
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 102, 204, 0.4);
        }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 15px 40px rgba(0, 128, 255, 0.6); }
        .contact-info { margin-top: 3rem; padding-top: 2rem; border-top: 1px solid rgba(0, 212, 255, 0.2); }
        .contact-info p { font-size: 1rem; margin-bottom: 0.5rem; }
        .contact-info strong { color: var(--electric-blue); }
            /* ===== Seletor de idioma / Language switcher ===== */
        .lang-switch {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-left: 3rem;
            flex: 0 0 auto;
        }
        .lang-switch-label {
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-gray, #b3d9ff);
            white-space: nowrap;
            line-height: 1;
        }
        .lang-flag {
            width: 30px;
            height: 30px;
            min-width: 30px;
            border-radius: 50%;
            overflow: hidden;
            display: block;
            border: 1px solid var(--glass-border, rgba(0, 212, 255, 0.35));
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .lang-flag:hover { transform: scale(1.12); box-shadow: 0 0 14px rgba(0, 212, 255, 0.55); }
        .lang-flag .flag-on, .lang-flag .flag-off { display: block; width: 100%; height: 100%; }
        .lang-flag .flag-off { display: none; }
        .lang-flag:hover .flag-on { display: none; }
        .lang-flag:hover .flag-off { display: block; }
        .lang-flag svg { display: block; width: 100%; height: 100%; }
        .lang-switch {
            position: fixed;
            top: 1.25rem;
            right: max(1.5rem, calc((100% - 1136px) / 2));
            margin-left: 0;
            z-index: 100;
        }
        @media (max-width: 560px) { .lang-switch-label { display: none; } }
    </style>
</head>
<body>
    <div class="lang-switch">
        <span class="lang-switch-label">Select language</span>
        <a href="en/obrigado.html" class="lang-flag" hreflang="en" title="View this page in English" aria-label="View this page in English">
            <span class="flag-on"><svg viewBox="0 0 60 60" aria-hidden="true"><rect width="60" height="60" fill="#DA291C"/><rect width="24" height="60" fill="#046A38"/><circle cx="24" cy="30" r="11" fill="#FFE900" stroke="#046A38" stroke-width="1.5"/><circle cx="24" cy="30" r="6.5" fill="#DA291C" stroke="#FFFFFF" stroke-width="1.5"/></svg></span>
            <span class="flag-off"><svg viewBox="0 0 60 60" aria-hidden="true"><rect width="60" height="60" fill="#012169"/><path d="M0 0 60 60M60 0 0 60" stroke="#FFFFFF" stroke-width="12"/><path d="M0 0 60 60M60 0 0 60" stroke="#C8102E" stroke-width="6"/><path d="M30 0V60M0 30H60" stroke="#FFFFFF" stroke-width="20"/><path d="M30 0V60M0 30H60" stroke="#C8102E" stroke-width="12"/></svg></span>
        </a>
    </div>
    <div class="container">
        <div class="success-icon"><i class="fas fa-check"></i></div>
        <h1>Obrigado pelo Contacto!</h1>
        <p>Recebi a sua mensagem e responderei em breve, normalmente dentro de <strong>24 horas</strong>.</p>
        <a href="index.html" class="btn"><i class="fas fa-arrow-left"></i> Voltar ao Site</a>
        <div class="contact-info">
            <p>Se precisar de algo urgente:</p>
            <p><strong>+351 912 405 722</strong></p>
            <p>andre.carmo@gmail.com</p>
        </div>
    </div>
    <script src="cookie-consent.js"></script>
</body>
</html>
